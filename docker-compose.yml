# MongoDB for working on the engine from source: `npm run db:up` starts it and a
# server run on the host (`npm run dev`) connects to 127.0.0.1:27017.
#
# The whole game in Docker (engine, Mongo and Caddy) is compose.game.yml, the
# file each release publishes as compose.yml. `npm run docker:up` runs that
# same file on an image built from this checkout (compose.build.yml), so the
# stack tested here is the one creators run.
services:
  # A replica set of one node: MongoDB only offers transactions on a replica
  # set, and an economic commit that spans two documents (a trade, or mailing an
  # item) needs one, or a crash between the two writes duplicates or loses the
  # item. One node is still one process and one data directory; an existing
  # standalone volume converts in place on the next `up`.
  #
  # The healthcheck initiates the set the first time and is healthy once the
  # node is primary, which is what `npm run db:up` waits for. The member is
  # named 127.0.0.1, which is where a server run on the host finds it. The boot
  # line "[DB] ..." says whether the server got transactions.
  mongo:
    image: mongo:7
    container_name: engine-mongo
    restart: unless-stopped
    command: ['--replSet', 'rs0', '--bind_ip_all']
    ports:
      - '127.0.0.1:27017:27017'
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test:
        - CMD
        - mongosh
        - --quiet
        - --eval
        - "try { rs.status() } catch { rs.initiate({ _id: 'rs0', members: [{ _id: 0, host: '127.0.0.1:27017' }] }) }; db.hello().isWritablePrimary || quit(1)"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
      start_interval: 1s

volumes:
  mongo-data:
