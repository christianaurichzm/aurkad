services:
  # Standalone by default: one node, no extra step. The cost is that MongoDB
  # only offers transactions on a replica set, so an economic commit that spans
  # two documents (a trade, or mailing an item) is written one document at a
  # time and a crash in between can duplicate or lose the item. The server says
  # which of the two it got on the boot line "[DB] ...".
  #
  # To close that window, run this single node as a replica set - same data
  # directory, one init command, no cluster:
  #
  #   command: ['--replSet', 'rs0', '--bind_ip_all']
  #   docker compose exec mongo mongosh --quiet --eval \
  #     'rs.initiate({_id:"rs0",members:[{_id:0,host:"127.0.0.1:27017"}]})'
  #   MONGO_URI: mongodb://mongo:27017/game?replicaSet=rs0
  mongo:
    image: mongo:7
    container_name: engine-mongo
    restart: unless-stopped
    ports:
      - '127.0.0.1:27017:27017'
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ['CMD', 'mongosh', '--quiet', '--eval', "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: engine-app
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
    ports:
      - '8080:8080'
    environment:
      NODE_ENV: production
      PORT: '8080'
      MONGO_URI: mongodb://mongo:27017/game
      SESSION_SECRET: ${SESSION_SECRET:?set SESSION_SECRET in .env}
      BOOTSTRAP_ADMIN_USERNAME: ${BOOTSTRAP_ADMIN_USERNAME:-}
    volumes:
      # Creators edit these on the host - no image rebuild needed.
      # scripts/ hot-reloads; game.json applies on restart.
      - ./game.json:/app/game.json:ro
      - ./scripts:/app/scripts:ro
      - ./assets:/app/assets:ro
      - ./theme:/app/theme:ro
      - ./content:/app/content:ro
      - ./modules:/app/modules:ro
      # A game kept in a folder of its own is one mount in place of game.json,
      # assets, theme and content, plus GAME_DIR: /app/game in environment
      # above. scripts/ stays mounted for the engine's global.d.ts; the game's
      # own scripts live in its folder.
      #   - ./games/my-game:/app/game:ro

  # --- Multi-instance example (sharding by map) ---
  # Uncomment and adjust to run two server instances splitting maps between them.
  # Each instance must have a unique WS_PUBLIC_URL and a non-overlapping MAP_IDS.
  # A reverse proxy (nginx/Caddy) should route players to the correct instance.
  # Set TRUST_PROXY on each instance when you put one in front, or every player
  # shares one rate-limit bucket - see .env.example.
  #
  # app-b:
  #   build: .
  #   container_name: engine-app-b
  #   restart: unless-stopped
  #   depends_on:
  #     mongo:
  #       condition: service_healthy
  #   ports:
  #     - '8081:8081'
  #   environment:
  #     NODE_ENV: production
  #     PORT: '8081'
  #     MONGO_URI: mongodb://mongo:27017/game
  #     SESSION_SECRET: ${SESSION_SECRET:?set SESSION_SECRET in .env}
  #     WS_PUBLIC_URL: ws://your-host:8081
  #     MAP_IDS: map3,map4
  #   volumes:
  #     - ./game.json:/app/game.json:ro
  #     - ./scripts:/app/scripts:ro
  #     - ./assets:/app/assets:ro
  #     - ./theme:/app/theme:ro
  #     - ./content:/app/content:ro
  #     - ./modules:/app/modules:ro

volumes:
  mongo-data:
