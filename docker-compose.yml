services:
  # A replica set of one node: MongoDB only offers transactions on a replica
  # set, and an economic commit that spans two documents (a trade, or mailing an
  # item) needs one, or a crash between the two writes duplicates or loses the
  # item. One node is still one process and one data directory; an existing
  # standalone volume converts in place on the next `up`.
  #
  # The healthcheck initiates the set the first time and is healthy once the
  # node is primary. The member is named 127.0.0.1, which is where a server run
  # on the host (npm run dev) finds it; a container cannot reach it by that
  # name, so the app below connects with directConnection=true and never asks
  # the set where its members are. The boot line "[DB] ..." says which of the
  # two the server got.
  mongo:
    image: mongo:7
    container_name: engine-mongo
    restart: unless-stopped
    command: ['--replSet', 'rs0', '--bind_ip_all']
    ports:
      - '127.0.0.1:27017:27017'
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test:
        - CMD
        - mongosh
        - --quiet
        - --eval
        - "try { rs.status() } catch { rs.initiate({ _id: 'rs0', members: [{ _id: 0, host: '127.0.0.1:27017' }] }) }; db.hello().isWritablePrimary || quit(1)"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
      start_interval: 1s

  app:
    build: .
    container_name: engine-app
    restart: unless-stopped
    # As the owner of the folders mounted below, which the server writes to.
    user: ${UID:?set UID and GID in .env (id -u, id -g)}:${GID:?set GID in .env}
    depends_on:
      mongo:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: '8080'
      MONGO_URI: mongodb://mongo:27017/game?directConnection=true
      SESSION_SECRET: ${SESSION_SECRET:?set SESSION_SECRET in .env}
      BOOTSTRAP_ADMIN_USERNAME: ${BOOTSTRAP_ADMIN_USERNAME:-}
      CORS_ALLOWED_ORIGINS: ${PUBLIC_URL:-https://localhost}
      USE_SECURE_COOKIES: 'true'
      TRUST_PROXY: '1'
    volumes:
      # Creators edit these on the host - no image rebuild needed.
      # scripts/ hot-reloads; game.json applies on restart.
      - ./game.json:/app/game.json:ro
      # Writable: the boot writes content.generated.d.ts there for your editor,
      # and the script editor saves there.
      - ./scripts:/app/scripts
      - ./assets:/app/assets:ro
      # Writable: the Appearance page saves theme.json and its uploads here.
      - ./theme:/app/theme
      - ./content:/app/content:ro
      - ./modules:/app/modules:ro
      # A game kept in a folder of its own is one mount in place of game.json,
      # assets, theme and content, plus GAME_DIR: /app/game in environment
      # above. scripts/ stays mounted for the engine's global.d.ts; the game's
      # own scripts live in its folder.
      #   - ./games/my-game:/app/game:ro

  # The session cookie is Secure in production, and a browser never stores one
  # sent over plain http, so the game is only reachable through TLS - on your
  # own computer too, where Caddy signs https://localhost itself and the
  # browser warns once. On a server, set PUBLIC_URL=https://your.domain in
  # .env and Caddy fetches a real certificate.
  caddy:
    image: caddy:2
    container_name: engine-caddy
    restart: unless-stopped
    depends_on:
      - app
    command: caddy reverse-proxy --from ${PUBLIC_URL:-https://localhost} --to app:8080
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - caddy-data:/data

  # --- Multi-instance example (sharding by map) ---
  # Uncomment and adjust to run two server instances splitting maps between them.
  # Each instance must have a unique WS_PUBLIC_URL and a non-overlapping MAP_IDS.
  # Caddy then serves one site per instance, so its command becomes a Caddyfile
  # mounted at /etc/caddy/Caddyfile:
  #
  #   https://localhost { reverse_proxy app:8080 }
  #   https://localhost:8444 { reverse_proxy app-b:8081 }
  #
  # with '8444:8444' added to its ports.
  #
  # app-b:
  #   build: .
  #   container_name: engine-app-b
  #   restart: unless-stopped
  #   user: ${UID}:${GID}
  #   depends_on:
  #     mongo:
  #       condition: service_healthy
  #   environment:
  #     NODE_ENV: production
  #     PORT: '8081'
  #     MONGO_URI: mongodb://mongo:27017/game?directConnection=true
  #     SESSION_SECRET: ${SESSION_SECRET:?set SESSION_SECRET in .env}
  #     CORS_ALLOWED_ORIGINS: https://localhost,https://localhost:8444
  #     USE_SECURE_COOKIES: 'true'
  #     TRUST_PROXY: '1'
  #     WS_PUBLIC_URL: wss://localhost:8444
  #     MAP_IDS: map3,map4
  #   volumes:
  #     - ./game.json:/app/game.json:ro
  #     - ./scripts:/app/scripts
  #     - ./assets:/app/assets:ro
  #     - ./theme:/app/theme
  #     - ./content:/app/content:ro
  #     - ./modules:/app/modules:ro

volumes:
  mongo-data:
  caddy-data:
