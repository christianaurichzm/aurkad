# A game run from the published engine image, with no clone of the engine.
# Each release attaches this file as compose.yml with the image pinned to its
# version: upgrading the engine is changing that tag and `docker compose up -d`,
# and the game folder is never touched.
#
#   echo "ADMIN=yourname" > .env                  # this username becomes admin
#   docker compose up -d                          # https://localhost
#
# The first `up` writes a small playable game into game/. For another name, or
# a map drawn in 2:1 diamonds, make it yourself before that first `up`:
# `docker compose run --rm new-game "My Game" --isometric`.
#
# game/ is yours: edit it on the host, scripts hot-reload, the rest applies on
# `docker compose restart app`. The world (maps, players, items) lives in
# MongoDB, not in the folder. The engine runs as whoever owns this folder
# (compose-entrypoint.sh in the image), so what it writes into game/ (the
# Appearance page's theme/, scripts saved in the editor) is yours too.
#
# Login cookies are signed with SESSION_SECRET when .env sets one, and
# otherwise with a secret the first boot generates and keeps in the database.
#
# The login cookie is only ever sent over HTTPS (USE_SECURE_COOKIES), so Caddy
# sits in front even on your own computer. There it signs localhost with an
# authority of its own, and the browser warns once. On a server, point a domain
# at it and add PUBLIC_URL=https://your.domain to .env; Caddy fetches a real
# certificate for it.
services:
  # A replica set of one node, for transactions: a trade or a mailed item
  # writes two documents, and only a replica set writes them together. The
  # healthcheck initiates it the first time. Its member is named 127.0.0.1, so
  # the app connects directly instead of asking the set for its members.
  mongo:
    image: mongo:7
    restart: unless-stopped
    command: ['--replSet', 'rs0', '--bind_ip_all']
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test:
        - CMD
        - mongosh
        - --quiet
        - --eval
        - "try { rs.status() } catch { rs.initiate({ _id: 'rs0', members: [{ _id: 0, host: '127.0.0.1:27017' }] }) }; db.hello().isWritablePrimary || quit(1)"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
      start_interval: 1s

  app:
    image: ghcr.io/christianaurichzm/aurkad:latest
    restart: unless-stopped
    # Root only until the entrypoint becomes the owner of this folder.
    user: root
    entrypoint: [/app/compose-entrypoint.sh]
    depends_on:
      mongo:
        condition: service_healthy
    environment:
      PORT: '8080'
      GAME_DIR: /srv/game
      MONGO_URI: mongodb://mongo:27017/?directConnection=true
      SESSION_SECRET: ${SESSION_SECRET:-}
      BOOTSTRAP_ADMIN_USERNAME: ${ADMIN:-}
      CORS_ALLOWED_ORIGINS: ${PUBLIC_URL:-https://localhost}
      USE_SECURE_COOKIES: 'true'
      TRUST_PROXY: '1'
    volumes:
      - .:/srv

  new-game:
    image: ghcr.io/christianaurichzm/aurkad:latest
    profiles: [tools]
    user: root
    entrypoint:
      - /app/compose-entrypoint.sh
      - node
      - dist/server/contentPack/newGame.js
      - /srv/game
    environment:
      GAME_DIR: /srv/game
    volumes:
      - .:/srv

  caddy:
    image: caddy:2
    restart: unless-stopped
    command: caddy reverse-proxy --from ${PUBLIC_URL:-https://localhost} --to app:8080
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - caddy-data:/data

volumes:
  mongo-data:
  caddy-data:
