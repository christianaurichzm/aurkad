name: release

# A release is `npm version <patch|minor|major> && git push --follow-tags`:
# the tag is the single input here, so the image tag, the release name and the
# changelog range cannot drift from package.json.
on:
  push:
    tags: ['v*']

jobs:
  validation:
    uses: ./.github/workflows/ci.yml

  release:
    needs: validation
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      REPOSITORY: ${{ github.repository }}
      ACTOR: ${{ github.actor }}
    steps:
      # Full history: the changelog is the commit range since the previous tag.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # GHCR rejects an uppercase path, and the owner segment is spelled the way
      # GitHub spells the account.
      - name: image and push
        run: |
          IMAGE="ghcr.io/$(echo "$REPOSITORY" | tr '[:upper:]' '[:lower:]')"
          echo "$GH_TOKEN" | docker login ghcr.io -u "$ACTOR" --password-stdin
          docker build -t "$IMAGE:${GITHUB_REF_NAME#v}" -t "$IMAGE:latest" .
          docker push --all-tags "$IMAGE"
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"

      # Conventional-commit subjects are already the changelog; the release page
      # is where it lives, so there is no CHANGELOG.md to keep in sync.
      # compose.yml is how a creator installs the engine, so it goes out pinned
      # to this release's image: releases/latest/download/compose.yml is always
      # the newest, and one already downloaded keeps running what it names.
      - name: release
        run: |
          prev=$(git describe --tags --abbrev=0 "$GITHUB_REF_NAME^" 2>/dev/null || true)
          git log --no-merges --pretty='- %s' ${prev:+"$prev.."}"$GITHUB_REF_NAME" > notes.md
          sed "s|ghcr.io/christianaurichzm/aurkad:latest|$IMAGE:${GITHUB_REF_NAME#v}|" compose.game.yml > compose.yml
          gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file notes.md compose.yml

  # The quick start, typed the way a creator types it: on a fresh runner with
  # no registry login, so an image whose package is still private, or a
  # "latest" that is not this release, fails here and not on someone's first
  # try. Nothing is checked out: the workspace is the empty folder the quick
  # start begins in, and the runner's user is not uid 1000, which is the case
  # the entrypoint's ownership check exists for.
  install:
    needs: release
    runs-on: ubuntu-latest
    steps:
      - name: quick start
        run: |
          curl -fLO "https://github.com/$GITHUB_REPOSITORY/releases/latest/download/compose.yml"
          grep -q "aurkad:${GITHUB_REF_NAME#v}$" compose.yml
          echo "ADMIN=smoke" > .env
          docker compose up -d

      - name: the admin signs in
        run: |
          for _ in $(seq 60); do curl -skf https://localhost/readyz && break; sleep 2; done
          body='{"username":"smoke","password":"smoke-check-password"}'
          json='Content-Type: application/json'
          curl -skf -c jar -H "$json" -d "$body" https://localhost/register
          curl -skf -b jar -c jar -H "$json" -d "$body" https://localhost/admin/login
          test "$(stat -c %u game/game.json)" = "$(id -u)"

      - if: failure()
        run: docker compose logs

  # Pages has to be set to "GitHub Actions" as its source once, in the
  # repository settings, or this job has nothing to deploy to and fails.
  docs:
    needs: validation
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment: github-pages
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - run: npm ci

      - run: npm run docs:api

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs/api

      - uses: actions/deploy-pages@v4
