name: release

# A release is `npm version <patch|minor|major> && git push --follow-tags`:
# the tag is the single input here, so the image tag, the release name and the
# changelog range cannot drift from package.json.
on:
  push:
    tags: ['v*']

jobs:
  validation:
    uses: ./.github/workflows/ci.yml

  release:
    needs: validation
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      REPOSITORY: ${{ github.repository }}
      ACTOR: ${{ github.actor }}
    steps:
      # Full history: the changelog and the compatibility check both read the
      # range since the previous tag.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'

      - run: npm ci

      # What a game made on the previous release has to know, which opens the
      # release notes, and the gate that keeps a breaking change out of a minor
      # or a patch. `npm version` runs the same check before it tags, so this
      # fails only for a tag made some other way. The previous release is the
      # newest one published, not the newest tag: a tag whose run failed never
      # reached anyone, and has no compose.yml to upgrade from.
      - name: compatibility
        run: |
          prev=$(gh release view --json tagName --jq .tagName 2>/dev/null || true)
          echo "PREV=$prev" >> "$GITHUB_ENV"
          : > upgrade.md
          if [ -n "$prev" ]; then
            npm run --silent compat -- --base "$prev" --next "${GITHUB_REF_NAME#v}" | tee upgrade.md
          fi

      # GHCR rejects an uppercase path, and the owner segment is spelled the way
      # GitHub spells the account.
      - name: image
        run: |
          IMAGE="ghcr.io/$(echo "$REPOSITORY" | tr '[:upper:]' '[:lower:]')"
          docker build -t "$IMAGE:${GITHUB_REF_NAME#v}" -t "$IMAGE:latest" .
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"

      # A game made on the previous release, moved onto this image the way the
      # notes tell creators to: the same folder, database and account, only
      # the version on the image lines changed. Before the push, so a release
      # that cannot boot an existing game is never published. Not logged in to
      # the registry, like a creator.
      - name: upgrade from the previous release
        if: env.PREV != ''
        run: |
          mkdir "$RUNNER_TEMP/upgrade" && cd "$RUNNER_TEMP/upgrade"
          curl -fLO "https://github.com/$REPOSITORY/releases/download/$PREV/compose.yml"
          echo "ADMIN=smoke" > .env
          ready() {
            for _ in $(seq 60); do curl -skf https://localhost/readyz && return; sleep 2; done
            return 1
          }
          body='{"username":"smoke","password":"smoke-check-password"}'
          json='Content-Type: application/json'
          docker compose up -d
          ready
          curl -skf -H "$json" -d "$body" https://localhost/register

          sed -i "s|$IMAGE:${PREV#v}\$|$IMAGE:${GITHUB_REF_NAME#v}|" compose.yml
          grep -q "$IMAGE:${GITHUB_REF_NAME#v}$" compose.yml
          docker compose up -d
          ready
          curl -skf -c jar -H "$json" -d "$body" https://localhost/admin/login
          docker compose logs app > app.log
          if grep -q 'Nothing imported' app.log; then
            cat app.log
            exit 1
          fi

      - if: failure() && env.PREV != ''
        working-directory: ${{ runner.temp }}/upgrade
        run: docker compose logs

      - name: push
        run: |
          echo "$GH_TOKEN" | docker login ghcr.io -u "$ACTOR" --password-stdin
          docker push --all-tags "$IMAGE"

      # Conventional-commit subjects are already the changelog; the release page
      # is where it lives, so there is no CHANGELOG.md to keep in sync.
      # compose.yml is how a creator installs the engine, so it goes out pinned
      # to this release's image: releases/latest/download/compose.yml is always
      # the newest, and one already downloaded keeps running what it names.
      - name: release
        run: |
          {
            cat upgrade.md
            printf '\n## Changes\n\n'
            git log --no-merges --pretty='- %s' ${PREV:+"$PREV.."}"$GITHUB_REF_NAME"
          } > notes.md
          sed "s|ghcr.io/christianaurichzm/aurkad:latest|$IMAGE:${GITHUB_REF_NAME#v}|" compose.game.yml > compose.yml
          gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file notes.md compose.yml

  # The quick start, typed the way a creator types it: on a fresh runner with
  # no registry login, so an image whose package is still private, or a
  # "latest" that is not this release, fails here and not on someone's first
  # try. Nothing is checked out: the workspace is the empty folder the quick
  # start begins in, and the runner's user is not uid 1000, which is the case
  # the entrypoint's ownership check exists for.
  install:
    needs: release
    runs-on: ubuntu-latest
    steps:
      - name: quick start
        run: |
          curl -fLO "https://github.com/$GITHUB_REPOSITORY/releases/latest/download/compose.yml"
          grep -q "aurkad:${GITHUB_REF_NAME#v}$" compose.yml
          echo "ADMIN=smoke" > .env
          docker compose up -d

      - name: the admin signs in
        run: |
          for _ in $(seq 60); do curl -skf https://localhost/readyz && break; sleep 2; done
          body='{"username":"smoke","password":"smoke-check-password"}'
          json='Content-Type: application/json'
          curl -skf -c jar -H "$json" -d "$body" https://localhost/register
          curl -skf -b jar -c jar -H "$json" -d "$body" https://localhost/admin/login
          test "$(stat -c %u game/game.json)" = "$(id -u)"

      - if: failure()
        run: docker compose logs

  # Pages has to be set to "GitHub Actions" as its source once, in the
  # repository settings, or this job has nothing to deploy to and fails.
  docs:
    needs: validation
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment: github-pages
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'

      - run: npm ci

      - run: npm run docs:api

      - uses: actions/upload-pages-artifact@v5
        with:
          path: docs/api

      - uses: actions/deploy-pages@v5
