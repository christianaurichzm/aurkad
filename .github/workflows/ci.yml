name: ci

on:
  push:
    branches: [main, 'feature/**', 'refactor/**', 'fix/**']
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: ['20', '22']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - run: npm ci

      - name: typecheck
        run: npm run typecheck

      - name: lint
        run: npm run lint

      - name: format
        run: npm run format:check

      - name: test + coverage
        run: npx vitest run --coverage --reporter=verbose --reporter=json --outputFile=test-results.json

      - name: test count gate
        run: |
          node -e "
            const r = JSON.parse(require('fs').readFileSync('test-results.json', 'utf8'));
            const n = r.numPassedTests;
            console.log('Tests passed:', n);
            if (n < 400) { process.stderr.write('FAIL: test count ' + n + ' is below minimum 400\n'); process.exit(1); }
          "

      - name: bench (informational)
        run: npm run bench || true
